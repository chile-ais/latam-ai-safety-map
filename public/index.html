<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LatAm AI Safety Map</title>
<meta name="description" content="A field map of the organizations, programs, and communities that work on AI safety in Latin America.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
  <section class="map-panel" id="map-panel">
    <h1>LatAm AI Safety Map</h1>
    <svg id="map" role="img" aria-label="Illustrated island map of the Latin American AI safety field. Each region of the island is one category."></svg>
    <div class="tip" id="tip" hidden></div>
  </section>

  <section>
    <div class="listings-head">
      <h2>Listings</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="controls">
      <input type="search" id="search" placeholder="Search listings" aria-label="Search listings">
      <select id="country" aria-label="Filter by country"><option value="">All countries</option></select>
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Nothing matches these filters.</p>
  </section>

  <footer>Inspired by the <a href="https://aisafety.com/map" target="_blank" rel="noopener">AISafety.com field map</a>. Not affiliated with AISafety.com. Updated November 2026.</footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
