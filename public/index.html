<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LatAm AI Safety Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column; framed "ocean" map panel up top, filterable card directory below. */
:root {
  --bg: #f9f9f7;
  --surface: #fcfcfb;
  --ocean: #dce7ea;
  --land: #efede4;
  --land-active: #e6e2d2;
  --coast: #b5c4c9;
  --fg: #0b0b0b;
  --fg-2: #52514e;
  --muted: #898781;
  --hairline: #e1e0d9;
  --ring: rgba(11,11,11,0.10);
  --accent: #1c5cab;
  --cat-research: #2a78d6;
  --cat-policy: #1baf7a;
  --cat-training: #eda100;
  --cat-community: #e87ba4;
  --cat-career: #008300;
  --cat-media: #6250d6;
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --ocean: #10191c;
    --land: #242423;
    --land-active: #2e2d28;
    --coast: #39464a;
    --fg: #f0efec;
    --fg-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --ring: rgba(255,255,255,0.10);
    --accent: #6da7ec;
    --cat-research: #3987e5;
    --cat-policy: #199e70;
    --cat-training: #c98500;
    --cat-community: #d55181;
    --cat-career: #0ca30c;
    --cat-media: #9085e9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d;
  --surface: #1a1a19;
  --ocean: #10191c;
  --land: #242423;
  --land-active: #2e2d28;
  --coast: #39464a;
  --fg: #f0efec;
  --fg-2: #c3c2b7;
  --muted: #898781;
  --hairline: #2c2c2a;
  --ring: rgba(255,255,255,0.10);
  --accent: #6da7ec;
  --cat-research: #3987e5;
  --cat-policy: #199e70;
  --cat-training: #c98500;
  --cat-community: #d55181;
  --cat-career: #0ca30c;
  --cat-media: #9085e9;
  color-scheme: dark;
}
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
}
.wrap {
  max-width: 1060px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 56px;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
h1 {
  font-size: 26px;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
}
.intro {
  max-width: 60ch;
  color: var(--fg-2);
  margin: 0;
}

/* Controls */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin: 20px 0 14px;
}
.controls input[type="search"], .controls select {
  font: inherit;
  font-size: 14px;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  padding: 7px 10px;
}
.controls input[type="search"] { width: 200px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 11px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  background: var(--surface);
  color: var(--fg-2);
  cursor: pointer;
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.chip[aria-pressed="true"] {
  border-color: var(--fg);
  color: var(--fg);
  font-weight: 600;
}
.chip .n { color: var(--muted); font-size: 12px; }

/* Map panel: fixed dark-ocean illustration, the same in both themes. One island per category. */
.map-panel {
  position: relative;
  background: radial-gradient(130% 110% at 50% 0%, #133b46 0%, #0c2a33 55%, #081e25 100%);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  overflow-x: auto;
  overflow-y: hidden;
}
.map-panel svg { display: block; width: 100%; min-width: 640px; height: auto; }
.shelf1 { fill: none; stroke: rgba(173,224,206,0.10); stroke-width: 26; stroke-linejoin: round; }
.shelf2 { fill: none; stroke: rgba(173,224,206,0.16); stroke-width: 12; stroke-linejoin: round; }
.island { fill: #2f6e52; stroke: #b9e0c9; stroke-width: 1.3; stroke-linejoin: round; }
.island.alt { fill: #37795b; }
.island.gone { fill: #4d5a53; stroke: #a9b6ad; }
.pin { cursor: pointer; transition: opacity 0.15s; }
.pin.dim { opacity: 0.14; pointer-events: none; }
.pin circle.disc { fill: #f7f4ec; stroke-width: 2.4; }
.pin.inactive-org circle.disc { fill: #cfcaba; stroke-dasharray: 3 2; }
.pin text.ini { font-family: var(--sans); font-size: 7.5px; font-weight: 700; fill: #2b3640; text-anchor: middle; pointer-events: none; }
.pin text.pin-label { font-family: var(--sans); font-size: 8px; font-weight: 600; fill: #f1f6f3; text-anchor: middle; paint-order: stroke; stroke: rgba(6,20,26,0.55); stroke-width: 2.4px; stroke-linejoin: round; pointer-events: none; }
.pin:hover circle.disc, .pin:focus circle.disc { stroke-width: 3.6; }
.region-pill { pointer-events: none; }
.region-pill rect { fill: rgba(6,20,26,0.78); stroke: rgba(255,255,255,0.22); stroke-width: 0.8; }
.region-pill text { font-family: var(--sans); text-anchor: middle; }
.region-pill .r-name { font-size: 10.5px; font-weight: 700; fill: #eef5f1; }
.region-pill .r-sub { font-size: 8px; font-weight: 500; fill: #a9c2bb; }
.compass { pointer-events: none; }
.bg-research { background: var(--cat-research); }
.bg-policy { background: var(--cat-policy); }
.bg-training { background: var(--cat-training); }
.bg-community { background: var(--cat-community); }
.bg-career { background: var(--cat-career); }
.bg-media { background: var(--cat-media); }

/* Tooltip */
.tip {
  position: absolute;
  z-index: 5;
  max-width: 260px;
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--hairline);
  border-radius: 9px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  padding: 9px 11px;
  font-size: 12.5px;
  line-height: 1.45;
  pointer-events: none;
  display: none;
}
.tip .t-name { font-weight: 700; font-size: 13px; }
.tip .t-meta { color: var(--fg-2); margin: 1px 0 4px; display: flex; align-items: center; gap: 6px; }
.tip .t-meta .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tip .t-desc { color: var(--fg-2); }

/* Cards */
.cards-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin: 40px 0 14px;
}
h2.section {
  font-weight: 600;
  font-size: 18px;
  margin: 0;
}
.cards-head .count { color: var(--muted); font-size: 13px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 12px;
}
.card {
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.card.flash { outline: 2px solid var(--accent); outline-offset: 1px; }
.card h3 { font-size: 15.5px; font-weight: 700; margin: 0; line-height: 1.3; }
.card .meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 12px;
  color: var(--fg-2);
}
.card .meta .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.card .meta .sep { color: var(--muted); }
.card p { margin: 0; font-size: 13.5px; color: var(--fg-2); }
.card .foot { margin-top: auto; padding-top: 4px; font-size: 13px; display: flex; gap: 10px; align-items: center; }
.badge {
  font-size: 11px;
  border: 1px solid var(--hairline);
  color: var(--muted);
  border-radius: 5px;
  padding: 1px 6px;
}
.empty { color: var(--muted); padding: 24px 4px; }

/* State of play */
.facts { margin: 14px 0 0; padding: 0; list-style: none; max-width: 72ch; }
.facts li {
  padding: 10px 0;
  border-top: 1px solid var(--hairline);
  color: var(--fg-2);
  font-size: 14px;
}
.facts li strong { color: var(--fg); }
footer {
  margin-top: 48px;
  padding-top: 16px;
  border-top: 1px solid var(--hairline);
  font-size: 13px;
  color: var(--muted);
  max-width: 72ch;
}
footer p { margin: 0 0 6px; }

@media (max-width: 720px) {
  .controls input[type="search"] { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .pin { transition: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>LatAm AI Safety Map</h1>
    <p class="intro">The organizations, programs, and communities working on AI safety in Latin America.</p>
  </header>

  <section class="controls" aria-label="Filters">
    <input type="search" id="q" placeholder="Search listings" aria-label="Search listings">
    <select id="country" aria-label="Filter by country"><option value="">All countries</option></select>
    <div class="chips" id="cat-chips" role="group" aria-label="Filter by category"></div>
  </section>

  <section class="map-panel" aria-label="Map">
    <svg id="map" role="img" aria-label="Illustrated map of the Latin American AI safety field, with one island per category"></svg>
    <div class="tip" id="tip"></div>
  </section>

  <section>
    <div class="cards-head">
      <h2 class="section">Listings</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Nothing matches these filters.</p>
  </section>

  <section id="context-section" hidden>
    <div class="cards-head">
      <h2 class="section">State of play</h2>
    </div>
    <ul class="facts" id="facts"></ul>
  </section>

  <footer id="foot"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
"use strict";

const CATS = [
  { id: "research",   label: "Research" },
  { id: "policy",     label: "Governance" },
  { id: "training",   label: "Training & fellowships" },
  { id: "community",  label: "Community" },
  { id: "career",     label: "Career support" },
  { id: "media",      label: "Media & resources" }
];
const CAT_LABEL = Object.fromEntries(CATS.map(c => [c.id, c.label]));

const PIN_RING = { research: "#3987e5", policy: "#199e70", training: "#c98500", community: "#d55181", career: "#0ca30c", media: "#9085e9" };
const ICONS = new Set(["www.orcg.info", "cebri.org", "cegia.org.br", "scholarship.aisafety.ar", "apartresearch.com", "forum.effectivealtruism.org", "aifuturesfellowship.org", "baish.com.ar", "www.aismx.org", "chais.cl", "carrerasconimpacto.org", "riesgosia.org"]);
function iconFor(e) {
  if (!e.url) return null;
  try { const h = new URL(e.url).hostname; return ICONS.has(h) ? "icons/" + h + ".png" : null; } catch (_) { return null; }
}
function initialsFor(e) {
  const parts = (e.s || e.n).replace(/[^A-Za-z\u00C0-\u00FF0-9 ]/g, " ").trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return (parts[0] || "?").slice(0, 2).toUpperCase();
}

// Verified November 2026 against each organization's own public pages. ll is [lat, lon] of the home city, null for regional or online groups.
const DATA = [
  // Research
  { n: "Observatorio de Riesgos Catastróficos Globales (ORCG)", s: "ORCG", cat: "research", country: "Regional", city: null, ll: null, url: "https://www.orcg.info", d: "Policy research network on global catastrophic risks for the Spanish-speaking world. AI risk is a core workstream, with reports on AI governance in Latin America and advocacy for international red lines." },


  // Policy & civil society
  { n: "CEBRI — AISO proposal", s: "CEBRI (AISO)", cat: "policy", country: "Brazil", city: "Rio de Janeiro", ll: [-22.91, -43.17], url: "https://cebri.org/en/doc/375/an-ai-safety-and-opportunities-institute-for-brazil-a-sketch-of-characteristics-functions-and-potential-challenges", d: "Foreign-policy think tank behind the 2025 proposal for an AI Safety and Opportunities Institute (AISO) in Brazil, the region's most concrete AI-safety-institute design." },
  { n: "Centro de Estudos em Governança de IA (CEGIA)", s: "CEGIA", cat: "policy", country: "Brazil", city: "Brasília", ll: [-15.79, -47.88], url: "https://cegia.org.br", d: "Nonprofit working toward a safe transition to advanced AI: research on systemic risk, technical support for Brazil's AI bill, and Portuguese translations of AI safety materials." },

  // Training & fellowships
  { n: "AISAR — Becas de AI Safety Argentina", s: "AISAR", cat: "training", country: "Argentina", city: "Buenos Aires", ll: [-34.60, -58.38], url: "https://scholarship.aisafety.ar", d: "Six-month funded AI safety research scholarships hosted at the UBA-CONICET computer science institute, with stipends, compute, and paid mentors. Second cohort started October 2026." },
  { n: "Apart Research — Global South hackathons", s: "Apart hackathons", cat: "training", country: "Regional", city: null, ll: null, url: "https://apartresearch.com", d: "AI safety research sprints with physical hubs across the region, from Buenos Aires and Bogotá to Mérida and Florianópolis. Winning teams feed into Apart's fellowship." },
  { n: "ML4Good — LatAm bootcamps", s: "ML4Good", cat: "training", country: "Regional", city: null, ll: null, url: "https://ml4good.org", d: "Free ten-day AI safety bootcamps; editions held in Brazil (2024) and Colombia (2025), open to participants across the region." },
  { n: "AI Safety Collab — Spanish edition", s: "AIS Collab ES", cat: "training", country: "Regional", city: null, ll: null, url: "https://forum.effectivealtruism.org/posts/MwdLumQpcb33JmRY7/enais-ai-safety-collab-2026-winter-spanish-edition", d: "ENAIS's part-time online course on AI safety fundamentals; its first Spanish-language cohort ran in early 2026." },
  { n: "Condor Initiative", s: "Condor", cat: "training", country: "Brazil", city: null, ll: null, url: "https://www.condorinitiative.org", d: "Ran residential camps introducing top Brazilian students to AI safety careers, backed by Open Philanthropy. Wound down by 2026.", status: "inactive" },
  { n: "AI Futures Fellowship", s: "AIFF", cat: "training", country: "Mexico", city: "Mexico City", ll: [19.43, -99.13], url: "https://aifuturesfellowship.org", d: "Eight-week fellowship on catastrophic AI risks hosted at ITAM, with stipends and mentorship. Last cohort ran in early 2024.", status: "inactive" },

  // Community
  { n: "Buenos Aires AI Safety Hub (BAISH)", s: "BAISH", cat: "community", country: "Argentina", city: "Buenos Aires", ll: [-34.60, -58.38], url: "https://baish.com.ar", d: "The region's largest AI safety community, founded 2024: free technical and governance courses with BlueDot Impact, research sprints, monthly socials, and BAISH Labs." },
  { n: "AI Safety México (AISMX)", s: "AISMX", cat: "community", country: "Mexico", city: "Guadalajara", ll: [20.67, -103.35], url: "https://www.aismx.org", d: "Builds technical and governance AI safety capacity in Mexico, with chapters in Guadalajara and Yucatán: Spanish-language courses, hackathons with Apart Research, and VIGÍA, a pipeline tracking AI risk signals in the official gazette." },
  { n: "AI Safety Colombia", s: "AIS Colombia", cat: "community", country: "Colombia", city: "Bogotá", ll: [4.71, -74.07], url: "https://forum.effectivealtruism.org/groups/kWaENZ2iXoucur97G", d: "Community of researchers, engineers, and policy professionals. Co-ran ML4Good Colombia and hosted the Bogotá hub of the 2026 Global South hackathon, whose teams took two of its six global wins." },
  { n: "AI Safety Brazil", s: "AIS Brazil", cat: "community", country: "Brazil", city: null, ll: null, url: "https://luma.com/sooo8spc", d: "Community running free monthly online meetups on AI safety and governance, from the UN Global Dialogue to Brazil's AI bill." },
  { n: "ImpactRIO", s: "ImpactRIO", cat: "community", country: "Brazil", city: "Rio de Janeiro", ll: [-22.91, -43.17], url: "https://www.linkedin.com/company/impact-rio", d: "Brazil's first AI safety group, founded 2023: ran alignment and governance fellowships on BlueDot curricula before winding down.", status: "inactive" },
  { n: "CHAIS — Chile AI Safety", s: "CHAIS", cat: "community", country: "Chile", city: "Santiago", ll: [-33.45, -70.67], url: "https://chais.cl", d: "Early-stage initiative building AI safety as a discipline in Chile, across technical research, governance, and training. Runs a weekly reading group and a resource index; training programs are in design." },
  { n: "AI Safety Initiative UC Chile", s: "AIS UC Chile", cat: "community", country: "Chile", city: "Santiago", ll: [-33.45, -70.67], url: null, d: "Student group at UC Chile. Ran the country's first AI safety hackathon in 2023." },
  { n: "LANAIS — Latin American Network for AI Safety", s: "LANAIS", cat: "community", country: "Regional", city: null, ll: null, url: "https://lanais-website.pages.dev", d: "Early-stage network connecting AI safety researchers, students, and organizers across the region, modeled on its European counterpart ENAIS, with a board spanning six countries." },

  // Career support
  { n: "Carreras con Impacto", s: "Carreras con Impacto", cat: "career", country: "Regional", city: null, ll: null, url: "https://carrerasconimpacto.org", d: "Spanish-language career organization mentoring students across the region toward work on global catastrophic risks, with AI safety and AI governance courses and a 16-week mentorship program.", status: "unclear" },

  // Media & resources
  { n: "RiesgosIA.org", s: "RiesgosIA", cat: "media", country: "Regional", city: null, ll: null, url: "https://riesgosia.org", d: "Spanish-language reference on AI risks: a periodic table of 118 risks, a glossary, a career guide, and a mirror of the MIT AI Risk Repository. Also listed on the global field map." },
  { n: "HorizonteIA", s: "HorizonteIA", cat: "media", country: "Regional", city: null, ll: null, url: "https://horizonte-ia.info", d: "Automated weekday AI briefing in Portuguese and Spanish covering frontier models, safety, and governance, built to break the English-language bubble." }
];

// Regional context, late 2026. Compiled from legislative trackers, official gazettes, and summit records.
const FACTS = [
  "No Latin American country operates an <strong>AI safety institute</strong> or belongs to the International Network of AI Safety Institutes. The closest live effort is the 2025 CEBRI and ITS Rio proposal for a Brazilian AI Safety and Opportunities Institute.",
  "<strong>Funding</strong> for the region's safety groups comes almost entirely from outside: Coefficient Giving (formerly Open Philanthropy), EA Funds, Manifund, and Apart Research. No LatAm-based funder of this work was found.",
  "<strong>AI regulation</strong> in the region is moving without a frontier-safety focus: Peru has the first general AI law in force, Brazil's PL 2338 and Chile's risk-based bill are still in committee, and Argentina has gone deregulatory."
];

const state = { cat: null, country: "", q: "" };
const $ = id => document.getElementById(id);

function entryMatches(e) {
  if (state.cat && e.cat !== state.cat) return false;
  if (state.country && e.country !== state.country) return false;
  if (state.q) {
    const hay = (e.n + " " + (e.s || "") + " " + e.d + " " + e.country + " " + (e.city || "") + " " + CAT_LABEL[e.cat]).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}

function cardId(i) { return "card-" + i; }

function renderChips() {
  const box = $("cat-chips");
  box.innerHTML = "";
  const mk = (id, label, count) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", String(state.cat === id));
    b.innerHTML = (id ? '<span class="dot bg-' + id + '"></span>' : "") +
      label + (count != null ? ' <span class="n">' + count + "</span>" : "");
    b.addEventListener("click", () => { state.cat = (state.cat === id) ? null : id; update(); });
    box.appendChild(b);
  };
  mk(null, "All", DATA.length);
  for (const c of CATS) {
    const n = DATA.filter(e => e.cat === c.id).length;
    if (n) mk(c.id, c.label, n);
  }
}

function renderCards() {
  const grid = $("grid");
  grid.innerHTML = "";
  const order = Object.fromEntries(CATS.map((c, i) => [c.id, i]));
  const sorted = DATA.map((e, i) => ({ e, i }))
    .sort((a, b) => (order[a.e.cat] - order[b.e.cat]) || a.e.n.localeCompare(b.e.n));
  let shown = 0;
  for (const { e, i } of sorted) {
    const ok = entryMatches(e);
    if (ok) shown++;
    const card = document.createElement("article");
    card.className = "card";
    card.id = cardId(i);
    card.hidden = !ok;
    const place = e.city ? e.city + ", " + e.country : e.country;
    const status = e.status && e.status !== "active"
      ? ' <span class="badge">' + (e.status === "inactive" ? "inactive" : "status unclear") + "</span>" : "";
    let host = "";
    try { host = new URL(e.url).hostname.replace(/^www\./, ""); } catch (_) {}
    const foot = e.url && host
      ? '<div class="foot"><a href="' + e.url + '" target="_blank" rel="noopener">' + host + "</a></div>"
      : "";
    card.innerHTML =
      "<h3>" + e.n + status + "</h3>" +
      '<div class="meta"><span class="dot bg-' + e.cat + '"></span>' + CAT_LABEL[e.cat] +
      ' <span class="sep">·</span> ' + place + "</div>" +
      "<p>" + e.d + "</p>" + foot;
    grid.appendChild(card);
  }
  $("count").textContent = shown === DATA.length ? shown + " listings" : shown + " of " + DATA.length;
  $("empty").hidden = shown !== 0;
}

function jumpToCard(i) {
  state.cat = null; state.country = ""; state.q = ""; $("q").value = ""; $("country").value = "";
  update();
  const card = $(cardId(i));
  if (!card) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  card.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
  card.classList.add("flash");
  setTimeout(() => card.classList.remove("flash"), 1800);
}

const tip = $("tip");
function showTip(e, el, panel) {
  const place = e.city ? e.city + ", " + e.country : e.country;
  tip.innerHTML =
    '<div class="t-name">' + e.n + "</div>" +
    '<div class="t-meta"><span class="dot bg-' + e.cat + '"></span>' + CAT_LABEL[e.cat] + " · " + place + "</div>" +
    '<div class="t-desc">' + e.d + "</div>";
  tip.style.display = "block";
  const pb = panel.getBoundingClientRect();
  const eb = el.getBoundingClientRect();
  let x = eb.left - pb.left + panel.scrollLeft + eb.width / 2 + 12;
  let y = eb.top - pb.top - 10;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if (x + tw > panel.scrollLeft + pb.width - 10) x = eb.left - pb.left + panel.scrollLeft - tw - 12;
  if (x < panel.scrollLeft + 10) x = panel.scrollLeft + 10;
  if (y + th > pb.height - 10) y = pb.height - th - 10;
  if (y < 10) y = 10;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }

// One island per category; wound-down orgs move to the last one.
const ISLANDS = [
  { id: "community", name: "Bah\u00eda Comunidad",      sub: "Community",              cx: 250, cy: 190, rx: 158, ry: 100, seed: 11 },
  { id: "training",  name: "Valle Formaci\u00f3n",      sub: "Training & fellowships", cx: 612, cy: 160, rx: 132, ry: 80,  seed: 23 },
  { id: "policy",    name: "Cerro Gobernanza",           sub: "Governance",             cx: 135, cy: 428, rx: 92,  ry: 58,  seed: 37 },
  { id: "research",  name: "Sierra Investigaci\u00f3n", sub: "Research",               cx: 338, cy: 452, rx: 72,  ry: 52,  seed: 41 },
  { id: "media",     name: "Costa Medios",               sub: "Media & resources",      cx: 512, cy: 420, rx: 92,  ry: 58,  seed: 53 },
  { id: "career",    name: "Puerto Carreras",            sub: "Career support",         cx: 700, cy: 340, rx: 72,  ry: 50,  seed: 67 },
  { id: "gone",      name: "Isla Pante\u00f3n",         sub: "No longer active",       cx: 716, cy: 500, rx: 100, ry: 56,  seed: 79 }
];

function seeded(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function islandPath(isl) {
  const rand = seeded(isl.seed), pts = [], k = 16;
  for (let i = 0; i < k; i++) {
    const a = (i / k) * 2 * Math.PI, f = 0.88 + 0.24 * rand();
    pts.push([isl.cx + Math.cos(a) * isl.rx * f, isl.cy + Math.sin(a) * isl.ry * f]);
  }
  return d3.line().curve(d3.curveCatmullRomClosed.alpha(0.8))(pts);
}

let pinSel = null;
function drawMap() {
  const W = 840, H = 600;
  const svg = d3.select("#map").attr("viewBox", "0 0 " + W + " " + H);

  const defs = svg.append("defs");
  const pat = defs.append("pattern").attr("id", "waves")
    .attr("width", 36).attr("height", 28).attr("patternUnits", "userSpaceOnUse");
  pat.append("circle").attr("cx", 5).attr("cy", 6).attr("r", 1.1).attr("fill", "rgba(255,255,255,0.05)");
  pat.append("circle").attr("cx", 23).attr("cy", 19).attr("r", 1.1).attr("fill", "rgba(255,255,255,0.04)");
  defs.append("clipPath").attr("id", "pc").append("circle").attr("r", 7);
  svg.append("rect").attr("width", W).attr("height", H).attr("fill", "url(#waves)");

  const paths = ISLANDS.map(islandPath);
  const gShelf = svg.append("g"), gLand = svg.append("g");
  paths.forEach(d => gShelf.append("path").attr("class", "shelf1").attr("d", d));
  paths.forEach(d => gShelf.append("path").attr("class", "shelf2").attr("d", d));
  ISLANDS.forEach((isl, i) => gLand.append("path")
    .attr("class", "island" + (isl.id === "gone" ? " gone" : (i % 2 ? " alt" : "")))
    .attr("d", paths[i]));

  const rose = svg.append("g").attr("class", "compass").attr("transform", "translate(62,544)");
  rose.append("circle").attr("r", 27).attr("fill", "none")
    .attr("stroke", "rgba(255,255,255,0.22)").attr("stroke-width", 1);
  const star = "0,-24 4.5,-4.5 24,0 4.5,4.5 0,24 -4.5,4.5 -24,0 -4.5,-4.5";
  rose.append("polygon").attr("points", star).attr("transform", "rotate(45) scale(0.55)")
    .attr("fill", "rgba(255,255,255,0.18)");
  rose.append("polygon").attr("points", star).attr("fill", "rgba(255,255,255,0.38)");

  // Place each island's pins in centered rows.
  const placed = DATA.map((e, i) => ({ e, i, isl: e.status === "inactive" ? "gone" : e.cat }));
  const XSP = 62, YSP = 46;
  for (const isl of ISLANDS) {
    const items = placed.filter(x => x.isl === isl.id);
    const n = items.length;
    const perRow = n <= 3 ? n : Math.ceil(n / 2);
    const rows = Math.ceil(n / perRow);
    items.forEach((x, k) => {
      const row = Math.floor(k / perRow);
      const m = row === rows - 1 ? n - perRow * (rows - 1) : perRow;
      const col = k - row * perRow;
      x.cx = isl.cx + (col - (m - 1) / 2) * XSP;
      x.cy = isl.cy + (row - (rows - 1) / 2) * YSP - 5;
    });

    const wpx = Math.max(isl.name.length * 6.3, isl.sub.length * 4.8) + 22;
    const py = isl.cy - isl.ry - 26;
    const g = svg.append("g").attr("class", "region-pill");
    g.append("rect").attr("x", isl.cx - wpx / 2).attr("y", py - 15)
      .attr("width", wpx).attr("height", 30).attr("rx", 10);
    g.append("text").attr("class", "r-name").attr("x", isl.cx).attr("y", py - 2).text(isl.name);
    g.append("text").attr("class", "r-sub").attr("x", isl.cx).attr("y", py + 9).text(isl.sub);
  }

  const panel = document.querySelector(".map-panel");
  pinSel = svg.append("g").selectAll("g").data(placed).join("g")
    .attr("class", x => "pin" + (x.e.status === "inactive" ? " inactive-org" : ""))
    .attr("transform", x => "translate(" + x.cx + "," + x.cy + ")")
    .attr("tabindex", 0)
    .attr("role", "img")
    .attr("aria-label", x => x.e.n + ", " + CAT_LABEL[x.e.cat] + ", " + (x.e.city ? x.e.city + ", " : "") + x.e.country)
    .on("mouseenter", function (ev, x) { showTip(x.e, this, panel); })
    .on("mouseleave", hideTip)
    .on("focus", function (ev, x) { showTip(x.e, this, panel); })
    .on("blur", hideTip)
    .on("click", (ev, x) => { hideTip(); jumpToCard(x.i); })
    .on("keydown", (ev, x) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); hideTip(); jumpToCard(x.i); } });

  pinSel.append("circle").attr("class", "disc").attr("r", 10)
    .style("stroke", x => PIN_RING[x.e.cat]);
  pinSel.each(function (x) {
    const g = d3.select(this);
    const ic = iconFor(x.e);
    if (ic) {
      g.append("image").attr("href", ic).attr("x", -7).attr("y", -7)
        .attr("width", 14).attr("height", 14)
        .attr("clip-path", "url(#pc)").attr("preserveAspectRatio", "xMidYMid slice");
    } else {
      g.append("text").attr("class", "ini").attr("y", 2.6).text(initialsFor(x.e));
    }
    g.append("text").attr("class", "pin-label").attr("y", 21).text(x.e.s || x.e.n);
  });
}

function updateMapDim() {
  if (pinSel) pinSel.classed("dim", x => !entryMatches(x.e));
}

function update() {
  renderChips();
  renderCards();
  updateMapDim();
}

function init() {
  const countries = [...new Set(DATA.map(e => e.country))].sort();
  for (const c of countries) {
    const o = document.createElement("option");
    o.value = c; o.textContent = c;
    $("country").appendChild(o);
  }
  $("country").addEventListener("change", ev => { state.country = ev.target.value; update(); });
  $("q").addEventListener("input", ev => { state.q = ev.target.value.trim().toLowerCase(); update(); });

  if (FACTS.length) {
    $("context-section").hidden = false;
    for (const f of FACTS) {
      const li = document.createElement("li");
      li.innerHTML = f;
      $("facts").appendChild(li);
    }
  }

  $("foot").innerHTML =
    "<p>Format borrowed, with admiration, from the <a href='https://aisafety.com/map' target='_blank' rel='noopener'>AISafety.com field map</a>. This page is independent and not affiliated with AISafety.com.</p>" +
    "<p>Compiled in November 2026 from each organization's own public pages, legislative trackers, and the June 2026 EA Forum mapping of the LatAm AI safety ecosystem. Descriptions paraphrase what the organizations say they do; inclusion is not endorsement. If something is missing, wrong, or defunct, it needs a correction.</p>";

  update();

  try { drawMap(); updateMapDim(); }
  catch (_) { document.querySelector(".map-panel").style.display = "none"; }
}
init();
</script>
